    <!-- Right Box: Functional Contact Form -->
            <div class="contact-form-card">
                
                <!-- PASTE / REPLACE THE FORM HERE -->
                <form action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST" class="contact-form">
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Your Email</label>
                        <input type="email" id="email" name="_replyto" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="_subject" placeholder="Project / Collaboration / Query" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
                <!-- END OF FORM -->

            </div>
